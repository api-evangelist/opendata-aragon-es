aid: opendata-aragon-es
name: Aragón Open Data
description: >-
  Aragón Open Data is a open data portal open-data portal for Spain running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 2,429 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
